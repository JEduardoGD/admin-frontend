<div class="container mt-5 text-center">
  <h1>Welcome</h1>
  <p class="lead mt-3">FMRE Administration</p>

  @if (isAuthenticated()) {
    <a class="btn btn-primary mt-3" routerLink="/admin">Go to Admin Panel</a>
  } @else {
    <button class="btn btn-primary mt-3" (click)="login()">Login</button>
  }
</div>
