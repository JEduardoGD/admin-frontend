<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/admin">FMRE Admin</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Control Panel</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        @if (isAuthenticated()) {
          <span class="text-light small">{{ userData().userData?.email }}</span>
          <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
        } @else {
          <button class="btn btn-outline-light btn-sm" (click)="login()">Login</button>
        }
      </div>
    </div>
  </div>
</nav>
