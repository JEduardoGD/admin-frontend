<div class="container mt-4">
  <h2>Register</h2>
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link" [class.active]="activeTab() === 'persona'" href="#"
        (click)="selectTab('persona'); $event.preventDefault()">Datos persona</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" [class.active]="activeTab() === 'domicilio'" href="#"
        (click)="selectTab('domicilio'); $event.preventDefault()">Datos domicilio y contacto</a>
    </li>
  </ul>

  @if (activeTab() === 'persona') {
  <app-register-person (personaSaved)="onPersonaSaved($event)" />
  }

  @if (activeTab() === 'domicilio') {
    @if (idPersona()) {
    <app-register-domicilio [idPersona]="idPersona()!" />
    } @else {
    <div class="alert alert-warning mt-3">Primero debes guardar los datos de la persona.</div>
    }
  }
